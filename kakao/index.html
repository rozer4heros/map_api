<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인포윈도우 생성하기</title>
    <style>
      .wrapper {
        display: grid;
        grid-template-columns: 1fr 5fr;
      }

      .location li {
        cursor: pointer;
      }

      .map {
        width: 100%;
        height: 800px;
      }
      .infoWindow {
        padding: 10px 29.5px;
        border: 1px solid #ccc;
        margin: 0;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.15);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <a href="../index.html">위로</a>
    <h2>카카오 지도</h2>
    <div class="wrapper">
      <ul class="location">
        <li data-lat="37.5665851" data-lng="126.9782038" data-title="서울시청">서울시청</li>
        <li data-lat="37.5175066" data-lng="127.0473753" data-title="강남구청">강남구청</li>
        <li data-lat="37.5323264" data-lng="126.9907031" data-title="용산구청">용산구청</li>
        <li data-lat="37.6540782" data-lng="127.0566045" data-title="노원구청">노원구청</li>
      </ul>
      <div id="map" class="map"></div>
    </div>
    <a href="multiMarker.html">여러개 마커 표시하기 예제</a>
    <script
      type="text/javascript"
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey=2c5add028e5a5a40288ccb3c1abcfb3a"
    ></script>
    <script>
      function myMap(lat, lng, title) {
        var mapContainer = document.getElementById("map"), // 지도를 표시할 div
          mapOption = {
            center: new kakao.maps.LatLng(lat, lng), // 지도의 중심좌표
            level: 3, // 지도의 확대 레벨
          };

        var map = new kakao.maps.Map(mapContainer, mapOption); // 지도를 생성합니다

        var iwContent = `<div class="infoWindow"><h2>${title}<h2></div>`, // 인포윈도우에 표출될 내용으로 HTML 문자열이나 document element가 가능합니다
          iwPosition = new kakao.maps.LatLng(lat, lng), //인포윈도우 표시 위치입니다
          iwRemoveable = true; // removeable 속성을 ture 로 설정하면 인포윈도우를 닫을 수 있는 x버튼이 표시됩니다

        // 인포윈도우를 생성하고 지도에 표시합니다
        var infowindow = new kakao.maps.InfoWindow({
          map: map, // 인포윈도우가 표시될 지도
          position: iwPosition,
          content: iwContent,
          removable: iwRemoveable,
        });
      }
      const locations = document.querySelectorAll(".location li");
      locations.forEach(l => {
        l.addEventListener("click", e => {
          myMap(l.getAttribute("data-lat"), l.getAttribute("data-lng"), l.innerText);
        });
      });

      myMap(37.5665851, 126.9782038, "서울시청");
    </script>
  </body>
</html>
